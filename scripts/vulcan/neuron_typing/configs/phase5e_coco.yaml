### model
model_name_or_path: /root/autodl-pub-RTX4090-hdd-1/models/qwen3.5-0.8b

### method
stage: sft
do_train: false
finetuning_type: full

### dataset
dataset_dir: data/phase5e_sample
dataset: phase5e_coco_sample2500
# ReasoningTemplate plus enable_thinking=false inserts the explicit empty
# <think></think> generation prefix expected by the native Qwen3.5 template.
template: qwen3_5
enable_thinking: false
cutoff_len: 1024
max_samples: 1
overwrite_cache: false
preprocessing_num_workers: 8
tokenized_path: saves/neuron_typing/cache/coco_sample2500_phase5e_caption_nothink

### output
output_dir: saves/neuron_typing/phase5e_tmp
