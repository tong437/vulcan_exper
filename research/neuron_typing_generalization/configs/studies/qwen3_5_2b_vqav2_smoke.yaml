name: qwen3_5_2b_vqav2_smoke
artifact_root: artifacts/neuron_typing_generalization

models:
  - ../models/qwen3_5_2b.yaml

datasets:
  - ../datasets/vqav2.yaml

metrics:
  - ../metrics/down_projection_weighted_rms.yaml

seeds: [42]

sampling:
  require_frozen_manifest: true
  manifest_tier: gpu_smoke
  pair_groups: 8
  expected_samples: 16

inference:
  batch_size: 1
  dtype: bfloat16
  inference_mode: true
  generate: false
  capture_all_decoder_layers: true
  stream_statistics: true

acceptance:
  expected_decoder_layers: 24
  expected_d_ff: 6144
  require_nonempty_visual_mask: true
  require_nonempty_text_mask: true
  compare_streaming_to_direct: true
